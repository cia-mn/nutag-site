server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # An Ortoo's link, as its tables print it: /o/{id}?t=12. Every one is the same page, which reads
    # the id and the table from its own address. A phone with the app never gets this far — the
    # two files under /.well-known/ are what tell it to open the app instead.
    location /o/ {
        try_files $uri /o/index.html;
    }

    # Apple fetches this one without an extension and refuses it unless it says it is JSON.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
    }
}
